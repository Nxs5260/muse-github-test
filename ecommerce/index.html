<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Shop — 轻量电商演示</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="topbar">
    <div class="logo">Mini <span>Shop</span></div>
    <input id="search" class="search" placeholder="搜索商品，例如：cable、面镜、清洁剂">
    <button class="cart-btn" onclick="openCart()">🛒 购物车（<span id="cartCount">0</span>）</button>
  </div>
</header>
<main>
  <h1>轻量电商演示</h1>
  <p class="sub">零依赖前端演示：筛选、搜索、购物车、模拟结算都已实现。共 <span id="count">12</span> 件示例商品。</p>
  <div class="filters">
    <button class="active" onclick="setCategory('all', this)">全部</button>
    <button onclick="setCategory('digital', this)">数码配件</button>
    <button onclick="setCategory('outdoor', this)">户外运动</button>
    <button onclick="setCategory('home', this)">居家清洁</button>
    <select id="sort">
      <option value="default">默认排序</option>
      <option value="price-asc">价格从低到高</option>
      <option value="price-desc">价格从高到低</option>
      <option value="rating">评分最高</option>
    </select>
  </div>
  <div id="grid" class="grid"></div>
  <p class="note">提示：购物车存在浏览器本地存储里，刷新页面不会丢；下单只是模拟，不会真实扣款。</p>
</main>

<aside id="drawer" class="drawer">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2>购物车</h2>
    <button class="close" onclick="closeCart()">关闭</button>
  </div>
  <div id="cartItems"></div>
  <div id="totals" class="totals"></div>
  <button class="checkout" onclick="openCheckout()">去结算</button>
</aside>

<div id="detailModal" class="modal" onclick="if(event.target===this) closeModal('detailModal')">
  <div class="modal-box">
    <div id="detailBody"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="detailAdd" class="checkout" style="margin:0">加入购物车</button>
      <button class="close" onclick="closeModal('detailModal')">关闭</button>
    </div>
  </div>
</div>

<div id="checkoutModal" class="modal" onclick="if(event.target===this) closeModal('checkoutModal')">
  <div class="modal-box">
    <h2>结算（演示）</h2>
    <form id="checkoutForm">
      <label>姓名</label><input required placeholder="例如：Nie">
      <label>收货地址</label><input required placeholder="街道、城市、邮编">
      <label>邮箱</label><input type="email" required placeholder="you@example.com">
      <button class="checkout" type="submit">模拟下单</button>
    </form>
    <div id="orderResult"></div>
    <p class="note">演示项目，没有真实支付。</p>
    <button class="close" onclick="closeModal('checkoutModal')">关闭</button>
  </div>
</div>

<script src="js/products.js"></script>
<script src="js/app.js"></script>
</body>
</html>
